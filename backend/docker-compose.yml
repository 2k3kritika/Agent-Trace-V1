services:
  postgres:
    image: postgres:16
    container_name: agenttrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agenttrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - agenttrace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d agenttrace"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenttrace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: AgentTrace
      APP_ENV: docker
      DEBUG: "false"
      LOG_LEVEL: INFO

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agenttrace

      STORAGE_BACKEND: postgres

      AUTH_ENABLED: "false"
      JWT_SECRET_KEY: docker-development-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      CORS_ALLOWED_ORIGINS: http://localhost:5173

      AWS_REGION: ap-south-1
      DYNAMODB_TABLE: agenttrace
      S3_BUCKET:

      ENABLE_BEDROCK: "false"
      ENABLE_DEMO_MODE: "true"

      MAX_TELEMETRY_PAYLOAD_BYTES: 1000000

    ports:
      - "8000:8000"

volumes:
  agenttrace_postgres_data: